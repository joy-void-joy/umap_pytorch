[project]
name = "umap_pytorch"
version = "0.0.06"
description = "Umap port for pytorch"
readme = "readme.md"
license = "MIT"
authors = [
    { name = "Elio Pascarelli", email = "elio@pascarelli.com" }
]
keywords = [
    "artificial intelligence",
    "deep learning",
    "dimensionality reduction",
    "UMAP",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
]
requires-python = ">=3.9"
dependencies = [
    "einops>=0.3",
    "pynndescent",
    "llvmlite>=0.34.0",
    "torch>=1.6",
    "scikit-learn",
    "umap-learn",
    "pytorch_lightning",
    "dill",
]

[project.optional-dependencies]
test = [
    "torchvision",
    "seaborn",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/elyxlz/umap_pytorch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["umap_pytorch"]

[dependency-groups]
dev = [
    "matplotlib>=3.9.4",
    "seaborn>=0.13.2",
    "torchvision>=0.23.0",
    "pyright>=1.1.390",
]

[tool.pyright]
typeCheckingMode = "standard"
include = ["umap_pytorch"]
